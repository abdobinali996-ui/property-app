name: Build Demo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons
        run: |
          pip install --quiet pillow
          python gen-icons.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-app-demo-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-apk-latest
          name: Demo APK (latest)
          files: android-app/android/app/build/outputs/apk/debug/app-debug.apk
