name: Build Production APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app-prod/**'
      - '.github/workflows/build-apk-prod.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons
        run: |
          pip install --quiet pillow
          python gen-icons.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app-prod/android
        run: ./gradlew assembleDebug --console=plain

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PropertyApp.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-app-prod-apk
          path: android-app-prod/PropertyApp.apk

      - name: Publish release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prod-apk-latest
          name: Production APK (latest)
          files: android-app-prod/PropertyApp.apk
