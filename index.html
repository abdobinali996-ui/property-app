<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة الأملاك العقارية</title>
<meta name="theme-color" content="#0b5563">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="login-logo">🏢</div>
    <h1>إدارة الأملاك العقارية</h1>
    <p class="muted">نظام محاسبي لإدارة العقارات والإيجارات وسندات القبض</p>
    <label>اسم المستخدم<input name="username" required autocomplete="username"></label>
    <label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary big" type="submit">دخول</button>
    <p id="loginError" class="error"></p>
  </form>
</div>

<!-- التطبيق -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">🏢 إدارة الأملاك العقارية</div>
    <div id="headerClock" class="header-clock" title="التاريخ والوقت الآن بتوقيت الرياض"></div>
    <div class="top-actions">
      <input id="globalSearchTop" type="search" placeholder="🔍 بحث شامل: سند، هوية، جوال، وحدة…" style="width:230px;max-width:44vw;padding:7px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff">
      <span id="userChip" style="font-size:13px;color:#dcebef;white-space:nowrap"></span>
      <button id="changePwBtn" class="btn ghost">🔑 كلمة السر</button>
      <button id="installBtn" class="btn ghost hidden">📲 تثبيت التطبيق</button>
      <button id="logoutBtn" class="btn ghost">خروج</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="active">لوحة المتابعة</button>
    <button data-view="properties">العقارات</button>
    <button data-view="units">الوحدات</button>
    <button data-view="tenants">المستأجرون</button>
    <button data-view="contracts">العقود</button>
    <button data-view="payments">سندات القبض</button>
    <button data-view="expenses">المصروفات</button>
    <button data-view="vouchers">سندات الصرف</button>
    <button data-view="statement">كشف المالك</button>
    <button data-view="owners">الملاك</button>
    <button data-view="monthly">الملخص الشهري</button>
    <button data-view="reports">التقارير</button>
    <button data-view="listings" data-admin-only>الإعلانات</button>
    <button data-view="audit">سجل الحركات</button>
    <button data-view="users" data-admin-only>المستخدمون</button>
    <button data-view="backup" data-admin-only>التصدير والنسخ</button>
    <button data-view="settings" data-admin-only>إعدادات المؤسسة</button>
  </nav>

  <main id="main"></main>

  <button id="quickReceipt" class="fab" title="إضافة سند قبض">+ سند قبض</button>
</div>

<!-- نافذة منبثقة عامة -->
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button id="modalClose" class="btn ghost">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- تنبيه التذكير بالذكر -->
<div id="dhikrToast" class="dhikr-toast hidden" title="اضغط للإخفاء"></div>

<!-- معاينة الطباعة -->
<div id="printPreview" class="print-preview hidden">
  <div class="print-preview-bar">
    <strong>معاينة الطباعة</strong>
    <div style="display:flex;gap:8px">
      <button class="btn primary" onclick="printNowFromPreview()">🖨️ طباعة الآن</button>
      <button class="btn" onclick="closePrintPreview()">إغلاق</button>
    </div>
  </div>
  <div id="printPreviewPage" class="print-preview-page"></div>
</div>

<!-- منطقة الطباعة -->
<div id="printArea"></div>

<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
